[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycastle"
version = "0.1.1"
description = "A reusable, installable autonomous development loop for any repository."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Krishna Kartik", email = "krishnakartik1@gmail.com" }]
dependencies = ["packaging>=22", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "pre-commit"]

[project.scripts]
pycastle = "pycastle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pycastle"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["pycastle"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
